[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "policysim"
version = "0.1.0"
description = "Local economic research workspace — foundation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=2.2,<3",
  "pandas>=2.2,<3",
  "pydantic>=2,<3",
  "scipy>=1.15,<2",
  "statsmodels>=0.14.5,<0.15",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "httpx2>=2.12.0",
  "mypy>=1.15,<2",
  "pip-audit>=2.9,<3",
  "pre-commit>=4,<5",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/src/policysim"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend/src", "backend/tests", "scripts"]
mypy_path = ["backend/src", "."]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "scripts/tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config --cov=policysim --cov-branch --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
source = ["policysim"]
branch = true
