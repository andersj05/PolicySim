repos:
  - repo: local
    hooks:
      - id: branch-guard
        name: Prevent direct protected-branch commits
        entry: uv run --locked python scripts/check_repo.py --commit-guard
        language: system
        pass_filenames: false
        always_run: true
      - id: repository-policy
        name: Repository and memory policy
        entry: uv run --locked python scripts/check_repo.py
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff
        name: Ruff lint
        entry: uv run --locked ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format --check
        language: system
        types: [python]
      - id: prettier
        name: Prettier
        entry: node frontend/node_modules/prettier/bin/prettier.cjs --check --ignore-unknown
        language: system
        types: [text]
