name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.5'
          enable-cache: true
      - run: uv sync --locked
      - run: npm --prefix frontend ci
      - name: Validate pull request route
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.base_ref }}
          PR_HEAD: ${{ github.head_ref }}
        run: uv run --locked python -c "import os; from scripts.check_repo import route_errors; errors = route_errors(os.environ['PR_BASE'], os.environ['PR_HEAD']); print(errors); raise SystemExit(bool(errors))"
      - run: uv run --locked python scripts/project.py check

  dependencies:
    name: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.5'
      - run: uv sync --locked
      - run: npm --prefix frontend ci
      - name: Audit Python runtime and development dependencies
        run: |
          uv export --locked --all-groups --no-emit-project --format requirements-txt --output-file /tmp/policysim-requirements.txt
          uv run --locked pip-audit --require-hashes --no-deps -r /tmp/policysim-requirements.txt
      - run: npm --prefix frontend audit --audit-level=high

  gate:
    name: quality-gate
    if: always()
    needs: [quality, dependencies]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every gate to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          AUDIT_RESULT: ${{ needs.dependencies.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$AUDIT_RESULT" = success
